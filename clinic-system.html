<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardinal Specialized Center · Sirna Odeeffannoo Kiliiniikaa</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8F7;--panel:#fff;--ink:#12292E;--mute:#5B7378;--line:#DCE8E6;--brand:#2F5F7C;--brand2:#4F9B7B;--soft:#E1EEEA;--warn:#C2410C;--warnbg:#FDEBDD;--ok:#16794C;--okbg:#DDF5E7;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A1D;--panel:#13272B;--ink:#E4F0EF;--mute:#8FA9AD;--line:#223C41;--brand:#7DB7D6;--brand2:#6FC29F;--soft:#173A3F;--warn:#FDA56B;--warnbg:#3A2316;--ok:#6FD9A0;--okbg:#143626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A1D;--panel:#13272B;--ink:#E4F0EF;--mute:#8FA9AD;--line:#223C41;--brand:#7DB7D6;--brand2:#6FC29F;--soft:#173A3F;--warn:#FDA56B;--warnbg:#3A2316;--ok:#6FD9A0;--okbg:#143626;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{margin:0;font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--brand);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,4.4vw,56px);line-height:1.05;max-width:12ch}
.hero p{max-width:38ch;opacity:.88;font-size:17px}
.pulse{position:absolute;right:-40px;bottom:30px;width:420px;opacity:.22}
.pulse path{stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;animation:dash 4s ease-out forwards}
@keyframes dash{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pulse path{animation:none}}
.logo{display:flex;gap:10px;align-items:center;font-weight:700}
.logo i{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;padding:5px}.logo i img{width:100%;height:100%;object-fit:contain}
.lform{display:grid;place-content:center;padding:32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.lform .card{width:min(380px,100%);padding:30px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{background:var(--brand);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
:root:not([data-theme="dark"]) .btn{color:#fff}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:20px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px}
#app{display:none;min-height:100vh;grid-template-columns:250px 1fr}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{padding:4px 8px 18px;color:var(--brand);font-size:15px;line-height:1.2}
nav .logo i{border:1px solid var(--line)}
nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
nav a span{width:22px;text-align:center}
.who{margin-top:18px;padding:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
main{padding:28px 34px 60px;max-width:1150px;width:100%}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:30px}.top p{margin:2px 0 0;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat b{display:block;font:700 32px Fraunces,serif;color:var(--brand)}
.stat small{color:var(--mute)}
.stat.lead{background:var(--brand);border-color:var(--brand)}
.stat.lead b,.stat.lead small{color:#fff}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-width:760px}
.form .wide{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.o{background:var(--okbg);color:var(--ok)}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dept{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px}
.dept:hover,.dept.on{border-color:var(--brand2);background:var(--soft)}
.dept em{font-style:normal;font-size:12px;color:var(--mute)}
.dept strong{display:block;font-size:16px;margin:2px 0 8px}
.dept .n{font:700 26px Fraunces,serif;color:var(--brand)}
.msg{border-left:3px solid var(--brand2);padding:6px 0 6px 12px;margin-bottom:12px}
.msg.u{border-color:var(--warn)}.msg small{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.empty{color:var(--mute);padding:18px 4px}
.mb{display:none}
@media (max-width:860px){
#login{grid-template-columns:1fr}.hero{padding:30px;min-height:240px}
#app{grid-template-columns:1fr}
nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
nav .logo,.who{display:none}nav a{white-space:nowrap;margin:0}
main{padding:20px 16px 50px}.stats{grid-template-columns:1fr 1fr}.grid2,.form{grid-template-columns:1fr}}
</style>
</head>

 $("rb").onclick=function(){
  var n=$("rn").value.trim(),a=$("ra").value;
  if(!n||!a){$("rerr").textContent="Maqaa fi umurii guuti.";return}
  var id="P-"+String(S.patients.length+1).padStart(3,"0");
  S.patients.push({id:id,name:n,age:+a,sex:$("rs").value,phone:$("rp").value,dept:+$("rd").value,date:today,note:$("rt").value});
  save();toast(id+" galmaa'eera");location.hash="records";};},
records:function(){
 $("main").innerHTML=head("Galmee dhukkubsatootaa","Maqaadhaan yookaan lakkoofsaan barbaadi.")+'<div class="card"><input id="q" placeholder="Barbaadi…" aria-label="Barbaadi" style="max-width:340px;margin-bottom:12px"><div id="rt">'+pTable(S.patients)+'</div></div>';
 $("q").oninput=function(){var v=this.value.toLowerCase();$("rt").innerHTML=pTable(S.patients.filter(function(p){return (p.name+p.id+p.phone).toLowerCase().indexOf(v)>-1}))};},
departments:function(){
 var sel=window.__d==null?0:window.__d;
 $("main").innerHTML=head("Kutaalee 1–10","Kutaa tokko filadhu, dhukkubsatoota isaa ilaali.")+
 '<div class="depts">'+DEPTS.map(function(d,i){var c=S.patients.filter(function(p){return p.dept===i}).length;return '<button class="dept '+(i===sel?"on":"")+'" data-i="'+i+'"><em>Kutaa '+(i+1)+'</em><strong>'+d+'</strong><span class="n">'+c+'</span> <em>dhukkubsataa</em></button>'}).join("")+'</div>'+
 '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:10px">'+(sel+1)+'. '+DEPTS[sel]+'</h3>'+pTable(S.patients.filter(function(p){return p.dept===sel}))+'</div>';
 document.querySelectorAll(".dept").forEach(function(b){b.onclick=function(){window.__d=+b.dataset.i;V.departments()}});},
messages:function(){
 $("main").innerHTML=head("Walqunnamtii keessaa","Ergaa hojjettoota gidduutti.")+'<div class="grid2"><div class="card">'+msgHtml(S.msgs.slice().reverse())+'</div><div class="card"><h3>Ergaa haaraa</h3><label for="mt">Ergaa</label><textarea id="mt" rows="4"></textarea><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="mu" style="width:auto"> Ariifachiisaa</label><button class="btn full" id="mb">Ergi</button></div></div>';
 $("mb").onclick=function(){var t=$("mt").value.trim();if(!t)return;S.msgs.push({from:S.user,text:t,t:new Date().toTimeString().slice(0,5),u:$("mu").checked?1:0});save();toast("Ergameera");V.messages()};},
appointments:function(){
 $("main").innerHTML=head("Beellama","Beellama haaraa qabadhu fi haala isaa ilaali.")+'<div class="grid2"><div class="card"><div class="tw"><table><tr><th>Dhukkubsataa</th><th>Kutaa</th><th>Guyyaa</th><th>Sa\'aatii</th><th>Haala</th></tr>'+(S.appts.length?S.appts.map(function(a,i){return '<tr><td><b>'+esc(a.who)+'</b></td><td>'+DEPTS[a.dept]+'</td><td>'+a.date+'</td><td>'+a.time+'</td><td><button class="tag '+(a.st==="Eeggachaa"?"w":"o")+'" style="border:0;cursor:pointer" data-i="'+i+'">'+a.st+'</button></td></tr>'}).join(""):'<tr><td colspan="5" class="empty">Beellamni hin jiru.</td></tr>')+'</table></div></div><div class="card"><h3>Beellama haaraa</h3><label for="aw">Dhukkubsataa</label><select id="aw">'+S.patients.map(function(p){return '<option>'+esc(p.name)+'</option>'}).join("")+'</select><label for="ad">Kutaa</label><select id="ad">'+DEPTS.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join("")+'</select><label for="ae">Guyyaa</label><input id="ae" type="date" value="'+today+'"><label for="at">Sa\'aatii</label><input id="at" type="time" value="09:00"><button class="btn full" id="ab">Beellama qabi</button></div></div>';
 $("ab").onclick=function(){if(!$("aw").value)return;S.appts.push({who:$("aw").value,dept:+$("ad").value,date:$("ae").value,time:$("at").value,st:"Eeggachaa"});save();toast("Beellamni qabameera");V.appointments()};
 document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){var a=S.appts[+b.dataset.i];a.st=a.st==="Eeggachaa"?"Mirkanaa'e":"Eeggachaa";save();V.appointments()}});},
admin:function(){
 if(S.user!=="admin"){$("main").innerHTML=head("Admin Panel","Bulchaa qofaaf.")+'<div class="card"><p>Fuula kana ilaaluuf akka <b>admin</b> tokkootti seeni. Hojjetaan biroon eeyyamni isaaf hin kennamne.</p></div>';return}
 $("main").innerHTML=head("Admin Panel","Sirna bulchuu.")+'<div class="stats"><div class="card stat"><b>'+S.patients.length+'</b><small>Dhukkubsatoota</small></div><div class="card stat"><b>'+S.staff.length+'</b><small>Hojjettoota</small></div><div class="card stat"><b>10</b><small>Kutaalee</small></div><div class="card stat"><b>'+S.msgs.length+'</b><small>Ergaalee</small></div></div><div class="card"><h3 style="margin-bottom:10px">Hojjettoota</h3><div class="tw"><table><tr><th>Maqaa</th><th>Gahee</th></tr>'+S.staff.map(function(s){return '<tr><td>'+s.u+'</td><td>'+s.r+'</td></tr>'}).join("")+'</table></div><button class="btn ghost" id="rs" style="margin-top:14px">Daataa hunda haqi</button></div>';
 $("rs").onclick=function(){try{localStorage.removeItem("keenya")}catch(e){}load();S.patients=[];S.appts=[];S.msgs=[];save();toast("Daataan haqameera");V.admin()};}
};
function msgHtml(l){return l.length?l.map(function(m){return '<div class="msg '+(m.u?"u":"")+'"><small>'+esc(m.from)+' · '+m.t+(m.u?' · ariifachiisaa':'')+'</small><div>'+esc(m.text)+'</div></div>'}).join(""):'<div class="empty">Ergaan hin jiru.</div>'}
load();
</script>
</body>
</html>
